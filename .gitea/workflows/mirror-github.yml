name: Mirror exact refs to GitHub

on:
  push:
  workflow_dispatch:

concurrency:
  group: github-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: self-hosted
    steps:
      - name: Checkout canonical Gitea source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mirror branches and tags exactly
        shell: bash
        env:
          GITHUB_MIRROR_DEPLOY_KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$GITHUB_MIRROR_DEPLOY_KEY"

          key_file="$(mktemp)"
          known_hosts="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts"' EXIT
          printf '%s\n' "$GITHUB_MIRROR_DEPLOY_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keyscan -t ed25519 github.com > "$known_hosts"
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts"

          git fetch --prune origin \
            '+refs/heads/*:refs/remotes/gitea/*' \
            '+refs/tags/*:refs/tags/*'
          git remote add github git@github.com:ciolansteen/plasma-applet-window-buttons6.git
          git push --prune --force github \
            '+refs/remotes/gitea/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*'
